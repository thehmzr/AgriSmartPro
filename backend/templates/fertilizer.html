    .header {
      overflow: hidden;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px 10px;

    }

      display: flex;
      align-items: center;
    }

      margin-right: 10px;
    }

      color: white;
      text-align: center;
      padding: 12px;
      text-decoration: none;
      font-size: 18px;
      line-height: 25px;
      border-radius: 4px;
    }

      font-size: 25px;
      font-weight: bold;
    }

      background-color: #ddd;
      color: black;
    }

    .header a.active {
      background-color: dodgerblue;
      color: white;
    }

      background: rgba(235, 233, 245, 0.5);
      font-weight: bold;
      padding-bottom: 10px;
      border-radius: 15px;
      margin: 20px auto;
      width: 80%;
      max-width: 1200px;
    }

    h1 {
      color: mediumseagreen;
      text-align: center;
    }

    .warning {
      color: red;
      font-weight: bold;
      text-align: center;
    }

  <body>
    <div class="header">
    <div class="header-left">
        <img src="/static/logo.png" style="width:60px; border-radius: 50%;">
        <a href="{{ url_for('dashboard') }}" class="logo">AgriSmartPro</a>
    </div>
    <div class="header-right">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('stock') }}">Stock Management</a>
        <a href="{{ url_for('fertilizer_recommendation') }}" class="active">Fertilizer Optimization</a>
        <a href="{{ url_for('index') }}">Yield Prediction</a>
        <a href="{{ url_for('index1') }}">Crop Recommendation</a>
        <a href="{{ url_for('demo') }}">Logout</a>
    </div>
</div>
  <div class="container">
    <h2>Get informed advice on fertilizer based on soil</h2>
    <br />
    <form method="POST" action="{{ url_for('fert_recommend') }}">
      <div class="form-group">
        <label for="Nitrogen">Nitrogen</label>
        <input type="number" class="form-control" id="Nitrogen" name="nitrogen"  required  min="0" max="200"/>
      </div>
      <div class="form-group">
        <label for="Phosphorous">Phosphorous</label>
        <input type="number" class="form-control" id="Phosphorous" name="phosphorous"  required  min="0" max="200"/>
      </div>
      <div class="form-group">
        <label for="Pottasium">Potassium</label>
        <input type="number" class="form-control" id="Pottasium" name="pottasium"  required  min="0" max="200"/>
      </div>
      <div class="form-group">
        <label for="crop">Crop you want to grow</label>
        <select name="cropname" class="form-control" id="crop" required>
          <option value="" selected disabled>Select crop</option>
           <option>rice</option>
        <option>maize</option>
        <option>chickpea</option>
        <option>kidneybeans</option>
        <option>pigeonpeas</option>
        <option>mothbeans</option>
        <option>mungbean</option>
        <option>blackgram</option>
        <option>lentil</option>
        <option>pomegranate</option>
        <option>banana</option>
        <option>mango</option>
        <option>grapes</option>
        <option>watermelon</option>
        <option>muskmelon</option>
        <option>apple</option>
        <option>orange</option>
        <option>papaya</option>
        <option>coconut</option>
        <option>cotton</option>
        <option>jute</option>
        <option>coffee</option>
        </select>
      </div>
      <div class="d-flex justify-content-center">
        <button type="submit" class="btn btn-info">Predict</button>
      </div>
    </form>
  </div>

  <div class="container1 py-2 mx-auto my-50 h-10">
    <div class="row">
      <div class="col-sm py-2 py-md-3">
        <div class="container">
          <p class="text-center">{{ recommendation }}</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
