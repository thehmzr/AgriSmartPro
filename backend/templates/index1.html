    .header {
      overflow: hidden;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .header-left img {
      margin-right: 10px;
    }

    .header a {
      color: white;
      text-align: center;
      padding: 12px;
      text-decoration: none;
      font-size: 18px;
      line-height: 25px;
      border-radius: 4px;
    }

    .header a.logo {
      font-size: 25px;
      font-weight: bold;
    }

    .header a:hover {
      background-color: #ddd;
      color: black;
    }

    .header a.active {
      background-color: dodgerblue;
      color: white;
    }

    .container {
      background: rgba(235, 233, 245, 0.5);
      font-weight: bold;
      padding-bottom: 10px;
      border-radius: 15px;
      margin: 20px auto;
      width: 80%;
      max-width: 1200px;
    }

    h1 {
      color: mediumseagreen;
      text-align: center;
    }

    .warning {
      color: red;
      font-weight: bold;
      text-align: center;
    }

    .card {
      margin: 20px auto;
      color: white;
    }

  </style>

  <body>
    <div class="header">
      <div class="header-left">
        <img src="/static/logo.png" style="width:60px; border-radius: 50%;">
        <a href="#default" class="logo">AgriSmartPro</a>
      </div>
      <div class="header-right">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('stock') }}">Stock Management</a>
            <a href="{{ url_for('fertilizer_recommendation') }}">Fertilizer Optimization</a>
            <a href="{{ url_for('index') }}">Yield Prediction</a>

        </div>
    </div>

  <div class="container my-3 mt-3">
      <h2 class="text-center">Crop Recommendation System </h2>

<!--      adding form-->
      <form action="/predict2" method="POST">
          <div class="row">
              <div class="col-md-4">
					<label for="Nitrogen">Nitrogen</label>
					<input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter Nitrogen" class="form-control" required step="0" min="0" max="200">
				</div>
               <div class="col-md-4">
					<label for="Phosporus">Phosphorus</label>
					<input type="number" id="Phosporus" name="Phosporus" placeholder="Enter Phosphorus" class="form-control" required step="00"  min="0" max="200">
				</div>
				<div class="col-md-4">
					<label for="Potassium">Potassium</label>
					<input type="number" id="Potassium" name="Potassium" placeholder="Enter Potassium" class="form-control" required step="0"  min="0" max="200">
				</div>
          </div>

          <div class="row mt-4">
				<div class="col-md-4">
					<label for="Temperature">Temperature</label>
					<input type="number" step="0.01" id="Temperature" name="Temperature" placeholder="Enter Temperature in °C" class="form-control" required step="0"  min="0" max="60">
				</div>
				<div class="col-md-4">
					<label for="Humidity">Humidity</label>
					<input type="number" step="0.01" id="Humidity" name="Humidity" placeholder="Enter Humidity in %" class="form-control" required step="0"  min="0" max="100">
				</div>
				<div class="col-md-4">
					<label for="pH">pH (value must be between 1 -14)</label>

					 <select for="pH" name="Ph"  placeholder="Enter pH value" class="form-control" required>
          <option selected>Select pH Value</option>
           <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
		<option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
					 </select>
				</div>
			</div>

          <div class="row mt-4">
				<div class="col-md-4">
					<label for="Rainfall">Rainfall</label>
					<input type="number" step="0.01" id="Rainfall" name="Rainfall" placeholder="Enter Rainfall in mm" class="form-control" required  min="0" max="400">
				</div>
			</div>



           <div class="row mt-4">

           <div class="col-md-12 text-center">
				<button type="submit" class="btn btn-primary btn-lg">Get Recommendation</button>
			</div>
			</div>
      </form>



       {% if result %}
		<div class="card bg-dark" style="width: 18rem;">

		  <div class="card-body">
			<h5 class="card-title">Recommend Crop for cultivation is:</h5>
			<p class="card-text">{{ result }}</p>
		  </div>
		</div>
	   {% endif %}
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
