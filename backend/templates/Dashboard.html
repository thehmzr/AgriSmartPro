<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px 10px;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-left img {
            margin-right: 10px;
        }

        .header a {
            color: white;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            font-size: 18px;
            line-height: 25px;
            border-radius: 4px;
        }

        .header a.logo {
            font-size: 25px;
            font-weight: bold;
        }

        .header a:hover {
            background-color: #ddd;
            color: black;
        }

        .header a.active {
            background-color: dodgerblue;
            color: white;
        }

        .header-right {
            display: flex;
        }

        .header-right a {
            margin-left: 10px;
        }

        @media screen and (max-width: 500px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header a {
                float: none;
                display: block;
                text-align: left;
            }

            .header-right {
                flex-direction: column;
                width: 100%;
            }

            .header-right a {
                margin-left: 0;
                width: 100%;
            }
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('/static/smart-agriculture.jpg');
            background-size: cover;
            background-position: center;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .button-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button-section a {
            position: relative;
            display: block;
            margin: 40px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .button-section img {
            width: 350px;
            height: 200px;
        }

        .button-section a::after {
            content: attr(data-text);
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            transition: bottom 0.3s ease;
        }

        .button-section a:hover::after {
            bottom: 0;
        }

        .button-section a:hover {
            transform: scale(1.1);
        }
    </style>
</head>

        </div>
        <div class="header-right">

            <a href="{{ url_for('demo') }}" id="logout">Logout</a>
        </div>
    </div>
